name: Validate Hercules Dashboard

on:
  push:
    paths:
      - 'index.html'
      - 'data/**'
      - '.github/workflows/reconstruct-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f data/state.js
          test -f data/history/index.json
          grep -q 'data/state.js' index.html
          grep -q 'Today.s Tasks\|Today’s Tasks' index.html
          grep -q 'Late / Carry-forward' index.html
          grep -q 'dayNav' index.html
          node --check data/state.js
          python -m json.tool data/history/index.json >/dev/null
          for f in data/history/20*.json; do python -m json.tool "$f" >/dev/null; done
          echo "Hercules dashboard validation passed."
