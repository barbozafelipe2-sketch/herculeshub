name: Reconstruct Hercules Dashboard

on:
  push:
    paths:
      - '.source_parts/**'
      - '.github/workflows/reconstruct-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact index.html
        shell: bash
        run: |
          cat .source_parts/part*.b64 | tr -d '\n\r' | base64 --decode > index.html
          echo "584e9abf764029bbe93da4a75d04e17e5af8f72133f7b90aea20dd4993ddff2f  index.html" | sha256sum --check --strict

      - name: Commit exact dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already exact; nothing to commit."
          else
            git commit -m "Publish exact Hercules dashboard"
            git push
          fi
