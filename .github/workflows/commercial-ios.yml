name: Commercial iOS
on:
  push:
    branches: [main]
    paths: ['commercial/**', '.github/workflows/commercial-ios.yml']
  pull_request:
    paths: ['commercial/**', '.github/workflows/commercial-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix commercial/backend --ignore-scripts --package-lock=false
      - run: node --test commercial/release/prepare.test.mjs
      - run: bash -n commercial/release/archive.sh
      - run: node --test commercial/backend/test/*.test.mjs
      - run: node -e "import('./commercial/backend/node_modules/@apple/app-store-server-library/dist/index.js').then(m => { if (!m.SignedDataVerifier || !m.AppStoreServerAPIClient) process.exit(1) })"
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node commercial/engine/scripts/verify-upstream.mjs
      - run: node commercial/engine/upstream/scripts/prepare-assets.mjs
      - run: npm --prefix commercial/engine run check
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path commercial/ios/HerculesCore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node commercial/engine/scripts/prepare-native-assets.mjs
      - run: brew install xcodegen
      - run: xcodegen generate --spec commercial/ios/project.yml
      - run: node commercial/release/verify-xcode-config.mjs
      - run: xcodebuild -project commercial/ios/HerculesHub.xcodeproj -scheme HerculesHub -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

