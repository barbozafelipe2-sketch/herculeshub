name: HerculesHub
options:
  bundleIdPrefix: com.herculeshub
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Sandbox: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Sandbox: Config/Sandbox.xcconfig
  Release: Config/Release.xcconfig
packages:
  HerculesCore:
    path: HerculesCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "$(HERCULES_MARKETING_VERSION)"
    CURRENT_PROJECT_VERSION: "$(HERCULES_BUILD_NUMBER)"
targets:
  HerculesHub:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/Catalog
      - path: App/Resources/Catalog
        type: folder
        buildPhase: resources
    dependencies:
      - package: HerculesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(HERCULES_BUNDLE_ID)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_HerculesAPIBaseURL: "$(HERCULES_API_BASE_URL)"
        INFOPLIST_KEY_HerculesMonthlyProductID: "$(HERCULES_MONTHLY_PRODUCT_ID)"
        INFOPLIST_KEY_HerculesPrivacyURL: "$(HERCULES_PRIVACY_URL)"
        INFOPLIST_KEY_HerculesTermsURL: "$(HERCULES_TERMS_URL)"
        INFOPLIST_KEY_CFBundleDisplayName: "Hércules Hub"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: HerculesHub.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
schemes:
  HerculesHub:
    build:
      targets:
        HerculesHub: all


  HerculesHub-Sandbox:
    build:
      targets:
        HerculesHub: all
    run:
      config: Sandbox
    archive:
      config: Sandbox
  HerculesHub-Production:
    build:
      targets:
        HerculesHub: all
    run:
      config: Release
    archive:
      config: Release
